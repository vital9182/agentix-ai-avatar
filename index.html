<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#021a26" />
  <meta name="description" content="Vintaqe Management Solutions delivers AI-enabled contact center, BPO, back-office and commercial infrastructure services." />
  <title>Vintaqe Management Solutions | Better conversations. Smarter operations.</title>
  <link rel="icon" href="/static/logo.png" />
  <link rel="stylesheet" href="/static/fonts/fonts.css" />
  <link rel="stylesheet" href="/static/site.css" />
</head>
<body>
  <div id="site"></div>

  <button id="start" class="start-pill" type="button" data-start>Start presentation</button>
  <div id="toast" role="status" aria-live="polite"></div>

  <aside id="presenter" class="glass" aria-label="AI co-presenter">
    <div class="stage">
      <video id="video" autoplay playsinline aria-label="Nico, the AI co-presenter"></video>
      <div class="stage-idle" aria-hidden="true">
        <img src="/static/logo-light.png" alt="" />
        <span>Nico is joining…</span>
      </div>
      <span class="live-badge" aria-hidden="true"><i></i>Live</span>
      <div id="talk" aria-live="polite">
        <kbd>SPACE</kbd>
        <span id="talk-text">Talk to Nico</span>
        <span id="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      </div>
    </div>
    <div class="presenter-bar">
      <div class="presenter-name">
        <strong>Nico</strong>
        <small>AI co-presenter · VMS</small>
      </div>
      <span id="state" aria-live="polite">
        <span id="mic" title="Lights up while your microphone is being heard" aria-label="Microphone status"></span>
        <span id="label">Ready</span>
      </span>
    </div>
    <div id="captions" aria-live="polite"></div>
    <button id="end" type="button" data-start>End presentation</button>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.min.js"></script>
  <script src="/static/site.js"></script>

  <script>
    const { Room, RoomEvent, Track } = LivekitClient;
    const presenter = document.getElementById('presenter');
    const video = document.getElementById('video');
    const label = document.getElementById('label');
    const mic = document.getElementById('mic');
    const captions = document.getElementById('captions');
    const toastEl = document.getElementById('toast');
    const STATES = { initializing: 'Getting ready', listening: 'Listening', thinking: 'Thinking', speaking: 'Speaking' };
    let room = null;
    let toastTimer = null;
    let spotTimer = null;
    let stage = false;      // push-to-talk for noisy rooms (NICO_STAGE_MODE=1 on the server)
    let agentId = null;
    let talking = false;

    // "Vintaqe" is spoken as "Vintage"; show the brand spelling in captions.
    const brand = (text) => text.replace(/Vintage Management/g, 'Vintaqe Management');

    function toast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 6000);
    }

    function caption(speaker, segment, text) {
      let line = captions.querySelector(`[data-segment="${CSS.escape(segment)}"]`);
      if (!line) {
        line = document.createElement('p');
        line.dataset.segment = segment;
        line.className = speaker === 'Nico' ? 'cap-agent' : 'cap-user';
        line.innerHTML = `<b>${speaker}</b><span></span>`;
        captions.append(line);
        while (captions.children.length > 2) captions.firstElementChild.remove();
      }
      // Light up the slide item Nico is describing, using only the words he has just spoken.
      const before = Number(line.dataset.len || 0);
      line.dataset.len = text.length;
      if (speaker === 'Nico') SITE.spotlight({ text: text.slice(Math.max(0, before - 24)) });
      line.querySelector('span').textContent = brand(text);
      captions.scrollTop = captions.scrollHeight;
    }

    // The deck changes width when Nico's panel opens or closes. Fade it through the change so
    // the text re-wrapping is never seen.
    const deckEl = document.getElementById('site');
    function reflow(change) {
      deckEl.classList.add('dim');
      setTimeout(() => { change(); requestAnimationFrame(() => deckEl.classList.remove('dim')); }, 260);
    }

    // Several LiveKit accounts sit behind the server. If one fails (can't connect, the agent never joins,
    // a 4xx quota error), we report it and quietly retry on the next one.
    let account = null;
    let tried = [];
    let agentTimer = null;
    let agentJoined = false;

    async function failover(reason) {
      if (!room && !account) return;
      const bad = account;
      clearTimeout(agentTimer);
      if (room) { room.removeAllListeners(); room.disconnect(); room = null; }
      agentId = null;
      captions.replaceChildren();
      label.textContent = 'Switching…';
      tried.push(bad);
      fetch('/report', { method: 'POST', body: JSON.stringify({ account: bad, reason: String(reason || '') }) }).catch(() => {});
      try { await join(); } catch (err) { leave(); toast(err.message); }
    }

    async function toggle() {
      if (room) return leave();
      label.textContent = 'Connecting…';
      tried = [];
      account = null;

      try {
        // Ask for the microphone first, so a blocked mic never leaves an avatar session running.
        const probe = await navigator.mediaDevices.getUserMedia({ audio: true });
        probe.getTracks().forEach((t) => t.stop());
        reflow(() => document.body.classList.add('presenting'));
        await join();
      } catch (err) {
        leave();
        const blocked = err.name === 'NotAllowedError' || /permission|denied/i.test(err.message);
        toast(blocked
          ? 'Microphone blocked. Click the lock icon in the address bar, allow the microphone, then press Start again.'
          : err.message);
      }
    }

    async function join() {
      {
        const res = await fetch('/token?skip=' + encodeURIComponent(tried.join(','))).catch(() => {
          throw new Error('Can’t reach the server. Please check your connection and try again.');
        });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Nico is unavailable right now. Please try again shortly.');
        const { url, token, stage: stageMode, account: acct } = await res.json();
        account = acct;
        agentJoined = false;
        stage = !!stageMode;
        room = new Room();
        const mine = room;

        room.on(RoomEvent.TrackSubscribed, (track) => {
          track.attach(video);
          if (track.kind === Track.Kind.Video) presenter.classList.add('has-video');
        });

        room.on(RoomEvent.ParticipantAttributesChanged, (changed, participant) => {
          const state = changed['lk.agent.state'];
          if (state) {
            agentId = participant.identity;
            if (stage && !talking) talkState(state === 'speaking' ? 'speaking' : state === 'thinking' ? 'thinking' : 'idle');
            label.textContent = stage && state === 'listening' ? 'Tap clicker or SPACE to talk' : (STATES[state] ?? state);
            presenter.dataset.state = state;
            // Keep the spotlight while Nico talks; let it fade shortly after he stops.
            clearTimeout(spotTimer);
            if (state !== 'speaking') spotTimer = setTimeout(() => SITE.clear_spot(), 2500);
          }
        });

        room.on(RoomEvent.DataReceived, (payload, participant, kind, topic) => {
          if (topic !== 'ui') return;
          const { action, ...args } = JSON.parse(new TextDecoder().decode(payload));
          if (action === 'status') return void (label.textContent = args.text);
          if (action === 'error') { toast(args.text); return leave(); }
          if (action === 'failover') return void failover(args.text);
          SITE[action]?.(args);
        });

        room.registerTextStreamHandler('lk.transcription', async (reader, from) => {
          const speaker = from.identity === room.localParticipant.identity ? 'You' : 'Nico';
          const segment = reader.info.attributes?.['lk.segment_id'] ?? reader.info.id;
          let text = '';
          for await (const chunk of reader) {
            text += chunk;
            caption(speaker, segment, text);
          }
        });

        room.on(RoomEvent.ActiveSpeakersChanged, (speakers) =>
          { if (!stage) mic.classList.toggle('on', speakers.some((s) => s.isLocal)); });
        room.on(RoomEvent.ParticipantConnected, () => { agentJoined = true; });
        room.on(RoomEvent.Disconnected, () => { if (room === mine) leave(); });

        try {
          await room.connect(url, token);
        } catch (err) {
          return failover('connect failed: ' + err.message);
        }
        agentJoined = room.remoteParticipants.size > 0;
        // The agent for this account should join within seconds; if not, that account is not usable.
        clearTimeout(agentTimer);
        agentTimer = setTimeout(() => { if (room === mine && !agentJoined) failover('agent did not join'); }, 20000);
        await room.localParticipant.setMicrophoneEnabled(true);
        if (stage) { document.body.classList.add('stage-mode'); talkState('idle'); watchMic(); }
        label.textContent = 'Nico is joining…';
      }
    }

    // Stage mode: tap SPACE (or a clicker's Next/Previous) to talk to Nico, tap again to send.
    // Tapping while Nico is speaking cuts him off and starts listening: only the presenter can do that.
    const talkText = document.getElementById('talk-text');
    const bars = [...document.querySelectorAll('#bars i')];
    const rpc = (method) => room && agentId &&
      room.localParticipant.performRpc({ destinationIdentity: agentId, method, payload: '' }).catch(() => {});
    let talkTimer = null;
    let level = null;       // live microphone loudness, drives the bars
    let audioCtx = null;

    const TALK_TEXT = {
      idle: 'Talk to Nico', listening: 'Listening… tap SPACE when done',
      thinking: 'Nico is thinking…', speaking: 'Nico is speaking · SPACE to interrupt',
    };
    function talkState(s) {
      presenter.dataset.talk = s;
      talkText.textContent = TALK_TEXT[s];
    }
    function chime(freqs) { // two soft notes: rising = I'm listening, falling = got it
      try {
        audioCtx ??= new AudioContext();
        freqs.forEach((f, i) => {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + i * 0.09;
          o.frequency.value = f; o.type = 'sine';
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
          o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.2);
        });
      } catch {}
    }
    function watchMic() { // drive the bars from the real microphone level
      try {
        audioCtx ??= new AudioContext();
        const track = room.localParticipant.getTrackPublication(Track.Source.Microphone)?.track?.mediaStreamTrack;
        if (!track) return;
        const an = audioCtx.createAnalyser(); an.fftSize = 256;
        audioCtx.createMediaStreamSource(new MediaStream([track])).connect(an);
        const buf = new Uint8Array(an.frequencyBinCount);
        level = () => { an.getByteTimeDomainData(buf); let m = 0; for (const v of buf) m = Math.max(m, Math.abs(v - 128)); return m / 128; };
        (function tick() {
          if (!room) return;
          const l = talking && level ? Math.min(1, level() * 3) : 0;
          bars.forEach((b, i) => b.style.transform = `scaleY(${0.18 + l * (0.5 + 0.5 * Math.sin(performance.now() / 90 + i * 1.3) ** 2)})`);
          requestAnimationFrame(tick);
        })();
      } catch {}
    }
    function setTalking(on) {
      if (on === talking) return;
      talking = on;
      clearTimeout(talkTimer);
      mic.classList.toggle('on', on);
      if (on) {
        chime([660, 880]);
        talkState('listening');
        label.textContent = 'Listening…';
        rpc('start_turn');
        talkTimer = setTimeout(() => setTalking(false), 25000); // safety: never stay open
      } else {
        chime([880, 660]);
        talkState('thinking');
        label.textContent = 'Thinking';
        setTimeout(() => rpc('end_turn'), 350); // keep the tail of the last word
      }
    }
    addEventListener('keydown', (e) => {
      if (!stage || !room || e.repeat || !['Space', 'PageDown', 'PageUp'].includes(e.code)) return;
      e.preventDefault();
      setTalking(!talking);
    });

    function leave() {
      clearTimeout(agentTimer);
      talking = false;
      document.body.classList.remove('stage-mode');
      room?.disconnect();
      room = null;
      mic.classList.remove('on');
      presenter.classList.remove('has-video');
      delete presenter.dataset.state;
      reflow(() => document.body.classList.remove('presenting'));
      captions.replaceChildren();
      SITE.clear_spot();
      label.textContent = 'Ready';
    }

    document.querySelectorAll('[data-start]').forEach((el) => el.addEventListener('click', toggle));
  </script>
</body>
</html>
