services:
  web:
    build: .
    command: python server.py
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - LIVEKIT_URL
      - LIVEKIT_API_KEY
      - LIVEKIT_API_SECRET
      - NICO_STAGE_MODE
    expose:
      - "8080"
    restart: unless-stopped

  agent:
    build: .
    command: python agent.py start
    environment:
      - LIVEKIT_URL
      - LIVEKIT_API_KEY
      - LIVEKIT_API_SECRET
      - SYNTHESIA_API_KEY
      - SYNTHESIA_AVATAR_ID
      - CARTESIA_VOICE_ID
      - NICO_LANGUAGE
      - NICO_STAGE_MODE
      - OPENAI_API_KEY
      - PRESENTER_NAME
    restart: unless-stopped
